[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SergioRibera/sismo"
authors = ["Sergio Ribera"]

[workspace.dependencies]
sismo-format = { version = "0.1.1", path = "crates/sismo-format" }
sismo = { version = "0.1.1", path = "crates/sismo" }
thiserror = "2"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
crc32fast = "1.5"
sismo-macros = { version = "0.1.1", path = "crates/sismo-macros" }
log = { version = "0.4", features = ["std", "kv"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
libc = "0.2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
zudp = { version = "0.3.9", default-features = false, features = ["security", "discovery"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
sismo-analysis = { version = "0.1.1", path = "crates/sismo-analysis" }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
flume = { version = "0.11", features = ["async"] }
freya = { version = "=0.5.0-rc.13", features = ["i18n"] }
freya-winit = "=0.5.0-rc.13"
freya-core = "=0.5.0-rc.13"
freya-engine = "=0.5.0-rc.13"
freya-i18n = "=0.5.0-rc.13"
istmo = "0.1.1-alpha.5"
istmo-core = "0.1.1-alpha.5"
istmo-file-picker = "0.1.1-alpha.5"
istmo-opener = "0.1.1-alpha.5"
istmo-plugins = "0.1.1-alpha.5"
bincode = { version = "2", features = ["derive", "std"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"

[workspace.lints.rust]
unsafe_code = "deny"

# The viewer draws thousands of spans per frame; fully unoptimized it
# stutters, so debug builds keep some optimization and all of it for deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# istmo-plugins 0.1.1-alpha.5 does not compile on Windows or on targets where
# c_char is unsigned (aarch64); take the fixed commit until alpha.6 ships.
# Every istmo crate the fix touches comes from the same tree so one istmo-core
# links.
[patch.crates-io]
istmo-core = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
istmo-macros = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
istmo-build = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
istmo-plugins = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
istmo-plugins-schema = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
