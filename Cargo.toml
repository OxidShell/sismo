[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SergioRibera/sismo"
authors = ["Sergio Ribera"]

[workspace.dependencies]
sismo-format = { path = "crates/sismo-format" }
sismo = { path = "crates/sismo" }
thiserror = "2"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
crc32fast = "1.5"
sismo-macros = { path = "crates/sismo-macros" }
log = { version = "0.4", features = ["std", "kv"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
libc = "0.2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
zudp = { version = "0.3.8", default-features = false, features = ["security", "discovery"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
sismo-analysis = { path = "crates/sismo-analysis" }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
flume = { version = "0.11", features = ["async"] }
freya = { version = "=0.5.0-rc.13" }
freya-winit = "=0.5.0-rc.13"
freya-core = "=0.5.0-rc.13"
freya-engine = "=0.5.0-rc.13"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
