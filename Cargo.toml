[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SergioRibera/sismo"
authors = ["Sergio Ribera"]

[workspace.dependencies]
sismo-format = { path = "crates/sismo-format" }
sismo = { path = "crates/sismo" }
thiserror = "2"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
crc32fast = "1.5"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
