[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SergioRibera/sismo"
authors = ["Sergio Ribera"]

[workspace.dependencies]
sismo-format = { version = "0.1.1", path = "crates/sismo-format" }
sismo = { version = "0.1.1", path = "crates/sismo" }
thiserror = "2"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
crc32fast = "1.5"
sismo-macros = { version = "0.1.1", path = "crates/sismo-macros" }
log = { version = "0.4", features = ["std", "kv"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
libc = "0.2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
zudp = { version = "0.3.9", default-features = false, features = ["security", "discovery"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
sismo-analysis = { version = "0.1.1", path = "crates/sismo-analysis" }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
flume = { version = "0.11", features = ["async"] }
freya = { version = "=0.5.0-rc.13", features = ["i18n"] }
freya-winit = "=0.5.0-rc.13"
freya-core = "=0.5.0-rc.13"
freya-engine = "=0.5.0-rc.13"
freya-i18n = "=0.5.0-rc.13"
istmo = "0.1.1-alpha.5"
istmo-core = "0.1.1-alpha.5"
istmo-file-picker = "0.1.1-alpha.5"
istmo-opener = "0.1.1-alpha.5"
istmo-plugins = "0.1.1-alpha.5"
bincode = { version = "2", features = ["derive", "std"] }
hotpath = { version = "0.31", default-features = false }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"

[workspace.lints.rust]
unsafe_code = "deny"

# The viewer draws thousands of spans per frame; fully unoptimized it
# stutters, so debug builds keep some optimization and all of it for deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The analysis walks millions of spans per render on big recordings; at
# opt-level 1 that alone makes the viewer lag in debug builds.
[profile.dev.package.sismo-analysis]
opt-level = 3

# istmo-plugins 0.1.1-alpha.5 does not compile on Windows or on targets where
# c_char is unsigned (aarch64); take the fixed commit until alpha.6 ships.
# Every istmo crate the fix touches comes from the same tree so one istmo-core
# links.
[patch.crates-io]
istmo-core = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
istmo-macros = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
istmo-build = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
istmo-plugins = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
istmo-plugins-schema = { git = "https://github.com/SergioRibera/istmo", rev = "cc29d075fbeadee4ece9e9876f83b7ad15598ffc" }
# The hotpath function sink (hotpath-rs/hotpath#825) is merged but not
# released yet; take the merge commit until the next hotpath release.
hotpath = { git = "https://github.com/hotpath-rs/hotpath", rev = "573d7c21a87c60053c1b0d07a2b8f39324133772" }
# Demo only: Freya rc.13 with its hotpath bumped to the sink commit, so its own
# `#[hotpath::measure]` scopes reach sismo. Drop once Freya releases on a
# hotpath with the sink; every crate of that tree is patched so one Freya links.
freya = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-android = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-animation = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-clipboard = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-components = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-core = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-edit = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-engine = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-i18n = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-metrics-plugin = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-sdk = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-testing = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
freya-winit = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
pathgraph = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
ragnarok = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
tiny-cache = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
tiny-diff = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
tiny-notify = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
torin = { git = "https://github.com/SergioRibera/freya", branch = "sismo/hotpath-sink" }
