[package]
name = "sismo-viewer"
description = "Desktop viewer and headless CLI for sismo sessions and recordings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sismo"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:freya", "dep:freya-engine", "dep:rfd"]

[dependencies]
sismo-format.workspace = true
sismo-analysis.workspace = true
thiserror.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
zudp.workspace = true
tokio.workspace = true
flume.workspace = true
freya = { workspace = true, optional = true }
freya-engine = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }

[dev-dependencies]
freya-testing = "=0.5.0-rc.13"
sismo = { workspace = true, features = ["net", "log"] }
log.workspace = true

[lints]
workspace = true
