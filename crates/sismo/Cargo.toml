[package]
name = "sismo"
description = "Low-overhead in-app recorder for spans, logs and counters, streamed live or saved to file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["log", "file"]
log = ["dep:log"]
tracing = ["dep:tracing", "dep:tracing-core", "dep:tracing-subscriber"]
stdio = ["dep:libc"]
file = []
alloc = []
net = ["dep:zudp", "dep:tokio"]
# Per-OS default directories for crash reports and viewer keys.
istmo = ["dep:istmo-core"]
# Records every `#[hotpath::measure]` scope through hotpath's function sink.
hotpath = ["dep:hotpath", "hotpath/hotpath-sink"]

[dependencies]
sismo-format.workspace = true
sismo-macros.workspace = true
thiserror.workspace = true
log = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
zudp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
istmo-core = { workspace = true, optional = true }
hotpath = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true

[dev-dependencies]
log.workspace = true
tracing-subscriber = { workspace = true }
hotpath.workspace = true

[lints]
workspace = true

[[example]]
name = "demo"
required-features = ["log"]

[[test]]
name = "record"
required-features = ["log"]

[[test]]
name = "hotpath_bridge"
required-features = ["hotpath"]
