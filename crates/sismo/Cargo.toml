[package]
name = "sismo"
description = "Low-overhead in-app recorder for spans, logs and counters, streamed live or saved to file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["log", "file"]
log = ["dep:log"]
tracing = ["dep:tracing", "dep:tracing-core", "dep:tracing-subscriber"]
stdio = ["dep:libc"]
file = []
net = ["dep:zudp", "dep:tokio"]

[dependencies]
sismo-format.workspace = true
sismo-macros.workspace = true
thiserror.workspace = true
log = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
zudp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true

[dev-dependencies]
log.workspace = true
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[[example]]
name = "demo"
required-features = ["log"]
