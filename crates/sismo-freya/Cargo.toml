[package]
name = "sismo-freya"
description = "Freya plugin that feeds frame marks, render phases and tree metrics into sismo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["hotpath"]
# Records every `#[hotpath::measure]` scope through hotpath's function sink, so
# apps get it by adding the plugin. Freya's own measures join once Freya
# depends on a hotpath release with the sink (rc.13 is on 0.29).
hotpath = ["sismo/hotpath"]

[dependencies]
sismo.workspace = true
freya-winit.workspace = true
freya-core.workspace = true

[lints]
workspace = true

[dev-dependencies]
freya = { workspace = true, features = ["hotpath"] }
hotpath.workspace = true
sismo = { workspace = true, features = ["net", "tracing"] }
tracing-subscriber.workspace = true
